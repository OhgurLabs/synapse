name: Recovery Guards

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify Recovery Artifacts
        run: npm run verify:recovery

      - name: Verify Docs/API Route Consistency
        run: npm run verify:docs

      - name: Verify Task Claims Map To Real Files
        run: npm run verify:tasks

      - name: Verify Runtime Drift Guardrails
        run: npm run verify:runtime-guardrails

      - name: Run Test Suite
        run: node test.mjs
